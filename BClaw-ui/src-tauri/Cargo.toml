[package]
name = "bclaw-ui"
version = "0.1.0"
description = "BClaw Voice Assistant Client"
authors = ["openclaw"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = true
