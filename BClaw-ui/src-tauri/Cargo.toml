[package]
name = "bclaw-ui"
version = "0.1.0"
description = "BClaw Voice Assistant Client"
authors = ["openclaw"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = "2"
dirs = "5"
tokio = { version = "1", features = ["net", "time"] }
rand = "0.8"
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["shared"], optional = true }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.4", optional = true }

[features]
default = ["local-asr"]
local-asr = ["sherpa-onnx", "tar", "bzip2"]
dev-skills = []

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = true
